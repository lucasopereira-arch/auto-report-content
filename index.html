<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Report — Content</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap');
  :root {
    --bg:#0a0a0f; --surface:#13131a; --surface2:#1c1c26;
    --border:#2a2a38; --blu:#415FF2; --green:#37D3A4;
    --red:#ff5a5a; --yellow:#ffd047; --text:#f0f0f8; --muted:#6b6b88;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:28px 32px; max-width:960px; margin:0 auto; }

  h1 { font-size:22px; font-weight:700; margin-bottom:4px; }
  .sub { font-size:13px; color:var(--muted); margin-bottom:24px; }

  /* WEEK SELECTOR */
  .week-bar {
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; padding:12px 18px; margin-bottom:20px;
  }
  .week-bar label { font-size:12px; color:var(--muted); font-weight:600; }
  .week-controls { display:flex; align-items:center; gap:10px; }
  .week-controls select {
    background:var(--surface); border:1px solid var(--border);
    border-radius:6px; padding:6px 10px; color:var(--text);
    font-family:'DM Mono',monospace; font-size:13px; outline:none; cursor:pointer;
  }
  .week-controls select option { background:#1c1c26; }
  .week-range { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); margin-left:4px; }

  /* BUTTON */
  .fetch-btn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px; background:var(--blu); border:none; border-radius:10px;
    color:white; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600;
    cursor:pointer; margin-bottom:16px; transition:opacity .15s;
  }
  .fetch-btn:hover { opacity:.88; }
  .fetch-btn:disabled { opacity:.4; cursor:not-allowed; }

  /* STATUS */
  .status-bar {
    background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; padding:11px 16px; margin-bottom:20px;
    font-size:12px; color:var(--muted); display:flex; align-items:center; gap:10px;
    font-family:'DM Mono',monospace;
  }
  .sdot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .sdot.loading { background:var(--yellow); animation:pulse 1s infinite; }
  .sdot.done    { background:var(--green); }
  .sdot.error   { background:var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* SUMMARY */
  .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .sc { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .sc .lbl { font-size:10px; color:var(--muted); font-weight:600; letter-spacing:.8px; text-transform:uppercase; margin-bottom:6px; }
  .sc .val { font-family:'DM Mono',monospace; font-size:22px; font-weight:500; }
  .vg{color:var(--green)} .vr{color:var(--red)} .vy{color:var(--yellow)}

  /* CLIENT BLOCKS */
  .client-block { margin-bottom:12px; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .ch {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:var(--surface2); cursor:pointer; user-select:none;
  }
  .ch-left { display:flex; align-items:center; gap:10px; }
  .cdot { width:8px; height:8px; border-radius:50%; }
  .cname { font-size:13px; font-weight:600; }
  .cpct { font-size:11px; font-family:'DM Mono',monospace; padding:2px 10px; border-radius:20px; }
  .chev { font-size:11px; color:var(--muted); transition:transform .2s; }
  .chev.open { transform:rotate(180deg); }
  .cb { display:none; }
  .cb.open { display:block; }

  .col-hdr { display:grid; grid-template-columns:1fr 70px 90px 70px; padding:7px 0; border-top:1px solid var(--border); background:var(--surface); }
  .col-h { font-size:10px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); text-align:center; padding:0 8px; }
  .col-h:first-child { text-align:left; padding-left:16px; }

  .item-row { display:grid; grid-template-columns:1fr 70px 90px 70px; border-top:1px solid var(--border); align-items:center; }
  .item-row:hover { background:rgba(255,255,255,.015); }
  .iname { padding:9px 16px; font-size:12.5px; color:#c0c0d8; }
  .imeta { padding:9px 8px; font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); text-align:center; }
  .ireal { padding:9px 12px; font-family:'DM Mono',monospace; font-size:13px; font-weight:500; text-align:center; }
  .ipct  { padding:9px 12px; font-family:'DM Mono',monospace; font-size:11px; font-weight:500; text-align:center; }
  .pok{color:var(--green)} .pwarn{color:var(--yellow)} .pbad{color:var(--red)} .pna{color:var(--muted)}

  /* EXPORT */
  .export-btn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px; background:transparent; border:1px solid var(--green);
    border-radius:10px; color:var(--green); font-family:'DM Sans',sans-serif;
    font-size:14px; font-weight:600; cursor:pointer; margin-top:16px; transition:background .15s;
  }
  .export-btn:hover { background:rgba(55,211,164,.08); }

  .toast {
    position:fixed; bottom:24px; right:24px;
    background:var(--surface2); border:1px solid var(--green);
    border-radius:10px; padding:14px 20px; font-size:13px; font-weight:500; color:var(--green);
    display:none; gap:8px; align-items:center; box-shadow:0 8px 32px rgba(0,0,0,.4); z-index:999;
  }
  .toast.show { display:flex; }

  @media(max-width:600px){
    body{padding:16px;}
    .summary{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<h1>📊 Auto Report — Content</h1>
<p class="sub">Puxa automaticamente do ClickUp e YouTube. Semana: domingo → sábado.</p>

<!-- WEEK SELECTOR -->
<div class="week-bar">
  <label>Semana:</label>
  <div class="week-controls">
    <select id="selWeek">
      <option value="0">Esta semana</option>
      <option value="1">Semana passada</option>
      <option value="2">2 semanas atrás</option>
      <option value="3">3 semanas atrás</option>
    </select>
    <select id="selMonth" style="display:none"></select>
  </div>
  <span class="week-range" id="weekRange">—</span>
</div>

<button class="fetch-btn" id="fetchBtn" onclick="runReport()">⚡ Gerar Report</button>

<div class="status-bar">
  <div class="sdot" id="sdot"></div>
  <span id="stext">Selecione a semana e clique em Gerar Report.</span>
</div>

<div class="summary" id="summary" style="display:none">
  <div class="sc"><div class="lbl">Total orçado</div><div class="val" id="sumOrc">—</div></div>
  <div class="sc"><div class="lbl">Realizado</div><div class="val vg" id="sumReal">—</div></div>
  <div class="sc"><div class="lbl">% cumprimento</div><div class="val" id="sumPct">—</div></div>
  <div class="sc"><div class="lbl">Abaixo da meta</div><div class="val vr" id="sumAbaixo">—</div></div>
</div>

<div id="blocks"></div>
<button class="export-btn" id="exportBtn" style="display:none" onclick="exportCSV()">⬇️ Exportar CSV para Google Sheets</button>
<div class="toast" id="toast">✅ CSV gerado!</div>

<script>
const METAS = {
  'André Musso':     { 'YT LONGO':1, 'REELS':7, 'LINKEDIN':2, 'THUMB':3, 'CORTE CURTO':0, 'CORTE LONGO':0 },
  'Victor Peixoto':  { 'YT LONGO':2, 'LINKEDIN':2, 'THUMB':3, 'CORTE CURTO':0, 'CORTE LONGO':0 },
  'Instagram Turbo': { 'REELS':3, 'CARROSSEL':10, 'IMG ÚNICA':0 },
  'Turbo Cast':      { 'YT LONGO':1, 'CORTE CURTO':7, 'CORTE LONGO':7, 'THUMB':10 },
};
const CLIENT_COLORS = {
  'André Musso':'#415FF2','Victor Peixoto':'#37D3A4',
  'Instagram Turbo':'#E1306C','Turbo Cast':'#ff8a7a',
};

let reportData = {};
let currentPeriod = {};

// ── Week selector ──────────────────────────────────────
function getWeekBounds(weeksAgo) {
  const today = new Date();
  const dow = today.getDay(); // 0=Sun
  const thisSunday = new Date(today);
  thisSunday.setDate(today.getDate() - dow - (weeksAgo * 7));
  thisSunday.setHours(0,0,0,0);
  const thisSat = new Date(thisSunday);
  thisSat.setDate(thisSunday.getDate() + 6);
  return { start: thisSunday, end: thisSat };
}

function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtLabel(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }

function updateWeekRange() {
  const weeksAgo = parseInt(document.getElementById('selWeek').value);
  const { start, end } = getWeekBounds(weeksAgo);
  document.getElementById('weekRange').textContent = `${fmtLabel(start)} → ${fmtLabel(end)}`;
  return { startDate: fmtDate(start), endDate: fmtDate(end) };
}

document.getElementById('selWeek').addEventListener('change', updateWeekRange);
updateWeekRange();

// ── Status ────────────────────────────────────────────
function setStatus(msg, state='') {
  document.getElementById('stext').textContent = msg;
  document.getElementById('sdot').className = 'sdot' + (state ? ' '+state : '');
}

// ── Report ────────────────────────────────────────────
async function runReport() {
  const { startDate, endDate } = updateWeekRange();
  currentPeriod = { startDate, endDate };

  document.getElementById('fetchBtn').disabled = true;
  document.getElementById('summary').style.display = 'none';
  document.getElementById('exportBtn').style.display = 'none';
  document.getElementById('blocks').innerHTML = '';
  reportData = {};

  try {
    setStatus('Buscando dados...', 'loading');
    const res = await fetch(`/api/report?startDate=${startDate}&endDate=${endDate}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Erro desconhecido');
    reportData = data.report;
    renderReport();
    setStatus(`Report gerado! ${startDate} → ${endDate}`, 'done');
  } catch(err) {
    setStatus('Erro: ' + err.message, 'error');
  } finally {
    document.getElementById('fetchBtn').disabled = false;
  }
}

// ── Render ────────────────────────────────────────────
function pctClass(p) {
  if (p === null) return 'pna';
  if (p >= 100)   return 'pok';
  if (p >= 70)    return 'pwarn';
  return 'pbad';
}

function renderReport() {
  const container = document.getElementById('blocks');
  container.innerHTML = '';
  let totalOrc=0, totalReal=0, totalAbaixo=0;

  Object.entries(reportData).forEach(([client, counts], ci) => {
    const metas = METAS[client] || {};
    const color = CLIENT_COLORS[client] || '#888';

    let cOrc=0, cReal=0;
    Object.entries(metas).forEach(([fmt,meta]) => {
      if (meta > 0) { cOrc += meta; cReal += (counts[fmt]||0); }
    });
    const cPct = cOrc > 0 ? Math.round((cReal/cOrc)*100) : null;
    const pColor = cPct===null?'#888':cPct>=100?'#37D3A4':cPct>=70?'#ffd047':'#ff5a5a';

    const rows = Object.entries(metas).map(([fmt,meta]) => {
      const real = counts[fmt] || 0;
      const pct  = meta > 0 ? Math.round((real/meta)*100) : null;
      if (meta > 0) { totalOrc+=meta; totalReal+=real; if(real<meta) totalAbaixo++; }
      const rColor = pct!==null&&pct>=100?'var(--green)':pct!==null&&pct<70?'var(--red)':'var(--text)';
      return `
        <div class="item-row">
          <div class="iname">${fmt}</div>
          <div class="imeta">${meta>0?meta:'—'}</div>
          <div class="ireal" style="color:${rColor}">${real}</div>
          <div class="ipct ${pctClass(pct)}">${pct!==null?pct+'%':'—'}</div>
        </div>`;
    }).join('');

    const block = document.createElement('div');
    block.className = 'client-block';
    block.innerHTML = `
      <div class="ch" onclick="toggle(${ci})">
        <div class="ch-left">
          <div class="cdot" style="background:${color}"></div>
          <span class="cname">${client}</span>
          <span class="cpct" style="color:${pColor};background:${pColor}22;border:1px solid ${pColor}44">
            ${cPct!==null?cPct+'%':'—'}
          </span>
        </div>
        <span class="chev open" id="chev-${ci}">▼</span>
      </div>
      <div class="cb open" id="cb-${ci}">
        <div class="col-hdr">
          <div class="col-h">Formato</div>
          <div class="col-h">Meta</div>
          <div class="col-h">Realizado</div>
          <div class="col-h">%</div>
        </div>
        ${rows}
      </div>`;
    container.appendChild(block);
  });

  const gPct = totalOrc>0?Math.round((totalReal/totalOrc)*100):0;
  document.getElementById('sumOrc').textContent = totalOrc;
  document.getElementById('sumReal').textContent = totalReal;
  const pEl = document.getElementById('sumPct');
  pEl.textContent = gPct+'%';
  pEl.className = 'val '+(gPct>=100?'vg':gPct>=70?'vy':'vr');
  document.getElementById('sumAbaixo').textContent = totalAbaixo;
  document.getElementById('summary').style.display = 'grid';
  document.getElementById('exportBtn').style.display = 'flex';
}

function toggle(ci) {
  document.getElementById('cb-'+ci).classList.toggle('open');
  document.getElementById('chev-'+ci).classList.toggle('open');
}

// ── Export ────────────────────────────────────────────
function exportCSV() {
  const { startDate, endDate } = currentPeriod;
  let csv = `REPORT CONTENT — ${startDate} a ${endDate}\nCliente,Formato,Meta/sem,Realizado,% Cumprimento,Status\n`;
  Object.entries(reportData).forEach(([client, counts]) => {
    const metas = METAS[client]||{};
    Object.entries(metas).forEach(([fmt,meta]) => {
      const real = counts[fmt]||0;
      const pct  = meta>0?Math.round((real/meta)*100)+'%':'—';
      const status = meta>0?(real>=meta?'OK':real>=meta*.7?'PARCIAL':'ABAIXO'):'—';
      csv += `"${client}","${fmt}",${meta>0?meta:'—'},${real},${pct},${status}\n`;
    });
  });
  const blob = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `report-content-${startDate}.csv`;
  a.click();
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
